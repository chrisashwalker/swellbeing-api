[project]
name = "swellbeing-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris Walker", email = "hello@chrisashwalker.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
swellbeing-api = "swellbeing_api:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]